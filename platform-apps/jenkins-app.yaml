apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:
  name: jenkins-app
  namespace: argocd

spec:
  project: default
  source:
    repoURL: 'https://charts.jenkins.io'
    chart: jenkins
    targetRevision: 5.12.0
    helm:
      values: |
        controller: 
          adminPassword: "admin"
          serviceType: ClusterIP
          installPlugins:
              - kubernetes
              - workflow-aggregator
              - git
              - configuration-as-code

  destination:

    server: https://kubernetes.default.svc
    namespace: jenkins
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true    



