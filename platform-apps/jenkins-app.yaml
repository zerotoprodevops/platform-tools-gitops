apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  hostAliases:
        - ip: "128.24.70.119"
          hostnames:
            - "updates.jenkins.io"
  source:
    repoURL: 'https://charts.jenkins.io'
    chart: jenkins
    targetRevision: 5.12.0
    helm:
      values: |
        controller: 
          admin:
            password: "admin"
          serviceType: ClusterIP
          image:
            tag: "2.580.2-lts-jdk21"
          initContainer:                  
            image:
              tag: "2.580.2-lts-jdk21"
          
        persistence:
          size: "10Gi"
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true