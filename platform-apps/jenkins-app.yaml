apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:
  name: jenkins-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default
  source:
    repoURL: 'https://charts.jenkins.io'
    chart: jenkins
    targetRevision: 5.12.0
    helm:
      values: |
        controller: 
          admin:
            password: "admin"
          serviceType: ClusterIP
          # Override the init container to patch Java security before downloading plugins
          initContainerCommand: |
            /bin/sh -c '
            echo "jdk.certpath.disabledAlgorithms=" >> /etc/java/openjdk/security/java.security
            echo "jdk.tls.disabledAlgorithms=" >> /etc/java/openjdk/security/java.security
            /usr/local/bin/install-plugins.sh kubernetes workflow-aggregator git configuration-as-code
          installPlugins:
              - kubernetes
              - workflow-aggregator
              - git
              - configuration-as-code
              - skip-certificate-check
        persistence:
          size: "10Gi"    

  destination:

    server: https://kubernetes.default.svc
    namespace: jenkins
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true    



